  <rect x="360" y="180" width="740" height="130" rx="65" fill="#ffffff" fill-opacity="0.06" filter="url(#blur)"/>
  <rect x="1180" y="280" width="520" height="100" rx="50" fill="#ffffff" fill-opacity="0.06" filter="url(#blur)"/>
  <rect x="220" y="620" width="560" height="120" rx="60" fill="#ffffff" fill-opacity="0.05" filter="url(#blur)"/>
  <rect x="980" y="700" width="700" height="120" rx="60" fill="#ffffff" fill-opacity="0.05" filter="url(#blur)"/>

  <circle cx="1510" cy="180" r="320" fill="url(#sun)"/>
